<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCHP Search</title>
    <link rel="icon" href="lchpfav.png" type="image/png">
    
    <link rel="stylesheet" href="lchp.css">
    
    <style>
        .search-container {
            display: flex;
            flex-wrap: wrap; /* Agar responsif di layar kecil */
            gap: 10px;
            align-items: center;
            margin-bottom: 20px;
        }
        .search-container > input,
        .search-container > select,
        .search-container > button {
            flex-grow: 1; /* Agar bisa membesar */
        }
        #searchInput {
            flex-basis: 300px; /* Lebar dasar untuk input pencarian */
        }
    </style>
</head>
<body>

    <h1>LCHP Search</h1>
    
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Cari sesuatu...">
        <select id="categorySelect" aria-label="Pilih Kategori">
            <option value="all">di Semua Kategori</option>
            <option value="notes">di notes</option>
            <option value="tools">di tools</option>
            </select>
        <button id="searchButton">Cari</button>
    </div>

    <div id="searchResults"></div>

    <script>
        // Fungsi utama untuk menjalankan pencarian
        async function search() {
            const searchTerm = document.getElementById("searchInput").value.toLowerCase();
            const selectedCategory = document.getElementById("categorySelect").value; // Ambil kategori yang dipilih
            const resultsDiv = document.getElementById("searchResults");
            resultsDiv.innerHTML = '<p>Mencari file...</p>';

            // Daftar file yang tidak ingin ditampilkan di hasil pencarian
            const blacklistedFiles = ["index.html", "timesince.js", "lchp.css", "lchp.png", "lchpfav.png", "lchp.js"];
            
            // Konfigurasi repository Anda
            const owner = "lexiiz3417";
            const repo = "lexiiz3417.github.io";
            const basePath = "lchp";

            try {
                // Menggunakan API GitHub untuk mengambil semua file secara rekursif
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`);
                if (!response.ok) {
                    throw new Error(`Gagal mengambil data dari GitHub: ${response.statusText}`);
                }
                const data = await response.json();

                // Filter file yang berada di dalam path 'lchp' dan sesuai kriteria
                const searchResults = data.tree.filter(item => {
                    const isFile = item.type === 'blob';
                    const isInBasePath = item.path.startsWith(basePath + '/');
                    const fileName = item.path.split('/').pop(); // Ambil nama filenya saja
                    const isNotBlacklisted = !blacklistedFiles.includes(fileName);
                    const matchesSearch = item.path.toLowerCase().includes(searchTerm);

                    // KONDISI BARU UNTUK KATEGORI
                    // Cek apakah file berada di dalam kategori yang dipilih. Jika "all", lewati pengecekan ini.
                    const isInSelectedCategory = (selectedCategory === 'all') || item.path.startsWith(`${basePath}/${selectedCategory}/`);

                    return isFile && isInBasePath && isNotBlacklisted && matchesSearch && isInSelectedCategory;
                });

                displaySearchResults(searchResults, basePath);

            } catch (error) {
                console.error('Error:', error);
                resultsDiv.innerHTML = '<p class="error">Gagal melakukan pencarian. Silakan coba lagi.</p>';
            }
        }

        // Fungsi untuk menampilkan hasil pencarian
        function displaySearchResults(results, basePath) {
            const resultsDiv = document.getElementById("searchResults");
            resultsDiv.innerHTML = ""; // Kosongkan hasil sebelumnya

            if (results.length === 0) {
                resultsDiv.innerHTML = "<p>File tidak ditemukan.</p>";
                return;
            }

            const list = document.createElement("ul");
            results.forEach(item => {
                const listItem = document.createElement("li");
                const link = document.createElement("a");
                
                // Menggunakan item.path untuk membuat URL
                link.href = `/${item.path}`; 
                
                // Menghilangkan 'lchp/' dari teks yang ditampilkan agar lebih rapi
                link.textContent = item.path.replace(basePath + '/', ''); 
                
                listItem.appendChild(link);
                list.appendChild(listItem);
            });
            resultsDiv.appendChild(list);
        }

        // Menambahkan event listener untuk tombol search dan input
        document.getElementById("searchButton").addEventListener("click", search);
        document.getElementById("searchInput").addEventListener("keyup", function(event) {
            if (event.key === "Enter") {
                search();
            }
        });
    </script>

</body>
</html>
